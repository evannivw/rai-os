[package]
name = "rai-os"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Educational AArch64 kernel for QEMU virt"

[features]
coord-test-forged-completion = []
coord-test-worker-gateway = []
coord-test-fault = []
coord-test-spin = []
coord-test-flood = []
coord-test-bad-report = []

worker-test-bad-sequence = []
worker-test-fault = []
worker-test-spin = []
worker-test-flood = []
worker-test-bad-reply = []

service-test-bad-request = []
service-test-wrong-kind = []
service-test-bad-reply = []
service-test-worker-fault = []
# Deliberately halts at boot; verification uses a separate target directory.
exception-self-test = []
wait-test-both = []
wait-test-peer-exit = []
wait-test-peer-fault = []
wait-test-peer-spin = []
wait-test-call-limit = []
wait-test-queued = []
wait-test-invalid-send = []
ipc-test-rejections = []
ipc-test-flood = []
ipc-test-peer-exit = []
ipc-test-peer-fault = []
isolation-test-open-peer = []
lifecycle-test-spin = []
lifecycle-test-both-spin = []
lifecycle-test-invalid-exit = []
lifecycle-test-bad-call = []
schedule-test-corrupt-register = []
schedule-test-user-fault = []
timer-test-unexpected-irq = []
user-test-syscall-loop = []
user-test-mask-irq = []
user-test-disable-timer = []
user-test-expired-syscall = []
user-test-invalid-calls = []
user-test-read-kernel = []
user-test-write-code = []
user-test-uart = []
user-test-gic = []
user-test-execute-stack = []
user-test-privileged = []
context-test-unknown-svc = []
context-test-wrong-site = []
mmu-test-write-text = []
mmu-test-write-rodata = []
mmu-test-write-table = []
mmu-test-execute-data = []
mmu-test-unmapped = []

[dependencies]

[[bin]]
name = "rai-os"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
