[package]
name = "rai-os"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Educational AArch64 kernel for QEMU virt"

[features]
# Deliberately halts at boot; verification uses a separate target directory.
exception-self-test = []
mmu-test-write-text = []
mmu-test-write-rodata = []
mmu-test-write-table = []
mmu-test-execute-data = []
mmu-test-unmapped = []

[dependencies]

[[bin]]
name = "rai-os"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
