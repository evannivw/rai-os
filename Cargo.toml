[package]
name = "rai-os"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Educational AArch64 kernel for QEMU virt"

[features]
# Deliberately halts at boot; verification uses a separate target directory.
exception-self-test = []
schedule-test-corrupt-register = []
schedule-test-user-fault = []
timer-test-unexpected-irq = []
user-test-syscall-loop = []
user-test-mask-irq = []
user-test-disable-timer = []
user-test-expired-syscall = []
user-test-invalid-calls = []
user-test-read-kernel = []
user-test-write-code = []
user-test-uart = []
user-test-gic = []
user-test-execute-stack = []
user-test-privileged = []
context-test-unknown-svc = []
context-test-wrong-site = []
mmu-test-write-text = []
mmu-test-write-rodata = []
mmu-test-write-table = []
mmu-test-execute-data = []
mmu-test-unmapped = []

[dependencies]

[[bin]]
name = "rai-os"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
